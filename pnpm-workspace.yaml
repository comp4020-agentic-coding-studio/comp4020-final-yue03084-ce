# esbuild (used by Vite/Astro) needs its postinstall to set up its native
# binary; better-sqlite3 fetches its prebuilt binding the same way.
allowBuilds:
  esbuild: true
  better-sqlite3: true
# pnpm's minimum-release-age setting would otherwise block installing this
# version. Pinned exact (the exclusion list takes exact versions, not semver
# ranges) --- bump it alongside package.json's @astrojs/check.
minimumReleaseAgeExclude:
  - '@astrojs/check@0.9.10'
